<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MyDentalBooking</title>
    <meta
      name="description"
      content="Find dentists nearby, book appointments, and manage your dental clinic."
    />
    <meta name="theme-color" content="#4f80e8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="MyDentalBooking" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>

    <!-- Dynamic splash shown immediately on first load, replaced once the app is ready -->
    <style>
      #splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f4f7fc;
        font-family: "Inter", system-ui, -apple-system, sans-serif;
        transition: opacity 0.4s ease;
      }
      #splash.hide { opacity: 0; pointer-events: none; }
      .splash-inner {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
        width: 240px;
        max-width: 70vw;
      }
      .splash-logo {
        width: 76px;
        height: 76px;
        border-radius: 18px;
        box-shadow: 0 10px 28px rgba(79, 128, 232, 0.32);
        animation: splash-pulse 1.4s ease-in-out infinite;
      }
      @keyframes splash-pulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.06); }
      }
      .splash-name {
        font-weight: 700;
        font-size: 18px;
        letter-spacing: -0.02em;
        color: #1b2a44;
      }
      .splash-track {
        width: 100%;
        height: 6px;
        background: #e1ebfc;
        border-radius: 999px;
        overflow: hidden;
      }
      #splash-bar {
        height: 100%;
        width: 0;
        background: #4f80e8;
        border-radius: 999px;
        transition: width 0.25s ease;
      }
      #splash-pct {
        font-size: 13px;
        color: #708198;
        font-variant-numeric: tabular-nums;
      }
    </style>
    <div id="splash">
      <div class="splash-inner">
        <img src="/favicon.svg" alt="MyDentalBooking" class="splash-logo" />
        <div class="splash-name">MyDentalBooking</div>
        <div class="splash-track"><div id="splash-bar"></div></div>
        <div id="splash-pct">0%</div>
      </div>
    </div>
    <script>
      (function () {
        var pct = 0;
        var bar = document.getElementById("splash-bar");
        var txt = document.getElementById("splash-pct");
        // Ease toward 90% while the app boots; finishSplash() completes it to 100%.
        var timer = setInterval(function () {
          pct += Math.max(0.6, (90 - pct) * 0.08);
          if (pct > 90) pct = 90;
          if (bar) bar.style.width = pct + "%";
          if (txt) txt.textContent = Math.round(pct) + "%";
        }, 90);
        window.finishSplash = function () {
          if (window.__splashDone) return;
          window.__splashDone = true;
          clearInterval(timer);
          if (bar) bar.style.width = "100%";
          if (txt) txt.textContent = "100%";
          var s = document.getElementById("splash");
          if (!s) return;
          setTimeout(function () {
            s.classList.add("hide");
            setTimeout(function () { if (s) s.remove(); }, 450);
          }, 200);
        };
        // Safety: never let the splash hang forever
        setTimeout(function () { window.finishSplash(); }, 8000);
      })();
    </script>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
